name: Prepare APIVN Worker Custom Domain

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prepare-domain:
    runs-on: ubuntu-latest
    env:
      LEGACY_GATEWAY_ORIGIN_IP: ${{ vars.LEGACY_GATEWAY_ORIGIN_IP || '70.36.125.65' }}
    steps:
      - name: Remove only the legacy DNS-only gateway record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=/tmp/cf-domain-status.md
          : > "$STATUS"
          report() { gh issue comment 8 --repo loinguyen82/apikeya --body-file "$STATUS" >/dev/null 2>&1 || true; }
          trap report EXIT

          API='https://api.cloudflare.com/client/v4'
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          zones=$(curl -fsS "${AUTH[@]}" "${API}/zones?name=apivn.tech&account.id=${CLOUDFLARE_ACCOUNT_ID}")
          zone_id=$(printf '%s' "$zones" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo 'FAILED: apivn.tech is not available in this Cloudflare account.' > "$STATUS"
            exit 1
          fi

          records=$(curl -fsS "${AUTH[@]}" "${API}/zones/${zone_id}/dns_records?type=A&name=api.apivn.tech")
          legacy_ids=$(printf '%s' "$records" | jq -r --arg ip "$LEGACY_GATEWAY_ORIGIN_IP" '.result[] | select(.content == $ip and .proxied == false) | .id')
          removed=0
          while IFS= read -r record_id; do
            [ -z "$record_id" ] && continue
            result=$(curl -fsS -X DELETE "${AUTH[@]}" "${API}/zones/${zone_id}/dns_records/${record_id}")
            printf '%s' "$result" | jq -e '.success == true' >/dev/null
            removed=$((removed + 1))
          done <<< "$legacy_ids"

          {
            echo 'SUCCESS: Worker custom-domain prerequisite is ready.'
            echo "Removed legacy DNS-only A records: ${removed}"
            echo 'Gateway deployment will run next in this workflow.'
          } > "$STATUS"

  deploy-gateway:
    needs: prepare-domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck gateway
        run: npm run typecheck --workspace @aiapi/gateway

      - name: Test gateway
        run: npm test --workspace @aiapi/gateway

      - name: Validate Worker secrets
        working-directory: apps/gateway
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secret_list="$(npx wrangler secret list --format=json)"
          for required in \
            SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY \
            A6API_BASE_URL \
            A6API_KEY \
            INTERNAL_ADMIN_TOKEN \
            GATEWAY_USER_ASSERTION_SECRET; do
            if ! printf '%s' "$secret_list" | jq -e --arg name "$required" \
              'map(.name) | index($name) != null' >/dev/null; then
              echo "::error::ai-api-gateway missing Worker secret: $required"
              exit 1
            fi
          done

      - name: Deploy gateway Worker
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify custom domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            health="$(curl -fsS --max-time 10 https://api.apivn.tech/healthz 2>/dev/null || true)"
            if printf '%s' "$health" | jq -e \
              '.ok == true and .service == "gateway"' >/dev/null 2>&1; then
              curl -fsS --max-time 10 https://api.apivn.tech/v1/models \
                | jq -e '.object == "list" and (.data | length > 0)' >/dev/null
              echo 'api.apivn.tech is serving the gateway Worker.'
              exit 0
            fi
            sleep 10
          done
          echo '::error::api.apivn.tech did not become healthy after deployment.'
          exit 1
