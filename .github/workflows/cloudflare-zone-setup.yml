name: Setup APIVN Cloudflare Zone

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

jobs:
  setup-zone:
    runs-on: ubuntu-latest
    steps:
      - name: Create/find zone and configure API DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          echo 'Looking up apivn.tech zone...'
          LOOKUP=$(curl -fsS "${AUTH[@]}" "${API}/zones?name=apivn.tech&account.id=${CLOUDFLARE_ACCOUNT_ID}")
          ZONE_ID=$(printf '%s' "$LOOKUP" | jq -r '.result[0].id // empty')

          if [ -z "$ZONE_ID" ]; then
            echo 'Zone not found; creating apivn.tech...'
            CREATE=$(curl -fsS -X POST "${AUTH[@]}" "${API}/zones" \
              --data "{\"name\":\"apivn.tech\",\"account\":{\"id\":\"${CLOUDFLARE_ACCOUNT_ID}\"},\"type\":\"full\"}")
            ZONE_ID=$(printf '%s' "$CREATE" | jq -r '.result.id // empty')
            if [ -z "$ZONE_ID" ]; then
              echo "$CREATE" | jq
              exit 1
            fi
          fi

          ZONE=$(curl -fsS "${AUTH[@]}" "${API}/zones/${ZONE_ID}")
          echo "Zone status: $(printf '%s' "$ZONE" | jq -r '.result.status')"
          echo 'Cloudflare nameservers:'
          printf '%s' "$ZONE" | jq -r '.result.name_servers[]?'

          EXISTING=$(curl -fsS "${AUTH[@]}" "${API}/zones/${ZONE_ID}/dns_records?type=A&name=api.apivn.tech")
          RECORD_ID=$(printf '%s' "$EXISTING" | jq -r '.result[0].id // empty')
          BODY='{"type":"A","name":"api","content":"70.36.125.65","ttl":300,"proxied":false}'

          if [ -n "$RECORD_ID" ]; then
            curl -fsS -X PUT "${AUTH[@]}" "${API}/zones/${ZONE_ID}/dns_records/${RECORD_ID}" --data "$BODY" >/dev/null
            echo 'Updated api.apivn.tech -> 70.36.125.65 (DNS only)'
          else
            curl -fsS -X POST "${AUTH[@]}" "${API}/zones/${ZONE_ID}/dns_records" --data "$BODY" >/dev/null
            echo 'Created api.apivn.tech -> 70.36.125.65 (DNS only)'
          fi
