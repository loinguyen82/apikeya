name: Cloudflare Build Test

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck web
        run: npm run typecheck --workspace @aiapi/web

      - name: Build OpenNext for Cloudflare
        run: npm run cf:build --workspace @aiapi/web
