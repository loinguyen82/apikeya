name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        run: npm run typecheck --workspace @aiapi/web
      - name: Test web
        run: npm test --workspace @aiapi/web
      - name: Typecheck gateway
        run: npm run typecheck --workspace @aiapi/gateway
      - name: Test gateway
        run: npm test --workspace @aiapi/gateway
