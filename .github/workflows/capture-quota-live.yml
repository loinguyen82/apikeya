name: Capture live Quota UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-quota-live.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture production Quota
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test')
          const fs = require('fs')
          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 })
            const email = process.env.E2E_EMAIL || ''
            const password = process.env.E2E_PASSWORD || ''

            if (email && password) {
              await page.goto('https://apivn.tech/login', { waitUntil: 'networkidle' })
              await page.getByLabel('Email').fill(email)
              await page.getByLabel('Mật khẩu').fill(password)
              await page.getByRole('button', { name: 'Đăng nhập' }).click()
            } else {
              const suffix = `${Date.now()}-${Math.floor(Math.random() * 100000)}`
              await page.goto('https://apivn.tech/signup', { waitUntil: 'networkidle' })
              await page.getByLabel('Tên hiển thị').fill('Quota Capture')
              await page.getByLabel('Email').fill(`quota-capture-${suffix}@example.com`)
              await page.getByLabel('Mật khẩu').fill(`Quota-${suffix}!`)
              await page.getByRole('button', { name: 'Tạo tài khoản' }).click()
            }

            await page.waitForURL(/\/dashboard/, { timeout: 30000 })
            await page.goto('https://apivn.tech/dashboard/quota', { waitUntil: 'networkidle' })
            await page.waitForTimeout(1000)
            fs.mkdirSync('artifacts', { recursive: true })
            await page.screenshot({ path: 'artifacts/quota-live.png', fullPage: true })
            await browser.close()
          })().catch((error) => { console.error(error); process.exit(1) })
          NODE
      - name: Commit screenshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/quota-live.png
          git commit -m "chore: add live Quota screenshot" || exit 0
          git push
