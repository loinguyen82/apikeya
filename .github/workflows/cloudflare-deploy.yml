name: Deploy APIVN Web to Cloudflare

on:
  push:
    branches:
      - cloudflare-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: apivn-cloudflare-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ycrqwekkafexqnlxpczd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5FgV9hFON8ZZFLc0WEcH7A_q-pUWbus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck web
        run: npm run typecheck --workspace @aiapi/web

      - name: Build OpenNext for Cloudflare
        run: npm run cf:build --workspace @aiapi/web

      - name: Deploy Worker
        working-directory: apps/web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
