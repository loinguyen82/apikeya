name: Deploy APIVN Web to Cloudflare

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

concurrency:
  group: apivn-cloudflare-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ycrqwekkafexqnlxpczd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5FgV9hFON8ZZFLc0WEcH7A_q-pUWbus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Ensure Supabase admin secret on Worker
        working-directory: apps/web
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          put_if_present() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "Synced $name to apivn-web"
            fi
          }

          put_if_present SUPABASE_SECRET_KEY "${SUPABASE_SECRET_KEY:-}"
          put_if_present SUPABASE_SERVICE_ROLE_KEY "${SUPABASE_SERVICE_ROLE_KEY:-}"

          secret_list="$(npx wrangler secret list --format=json)"
          if ! printf '%s' "$secret_list" | jq -e 'map(.name) | any(. == "SUPABASE_SECRET_KEY" or . == "SUPABASE_SERVICE_ROLE_KEY")' >/dev/null; then
            echo '::error::apivn-web thiếu SUPABASE_SECRET_KEY/SUPABASE_SERVICE_ROLE_KEY. Signup và topup sẽ lỗi nếu deploy.'
            exit 1
          fi

          echo 'Supabase admin secret is present on apivn-web.'

      - name: Typecheck web
        run: npm run typecheck --workspace @aiapi/web

      - name: Build OpenNext for Cloudflare
        run: npm run cf:build --workspace @aiapi/web

      - name: Deploy Worker
        working-directory: apps/web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
