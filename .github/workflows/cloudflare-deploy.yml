name: Deploy APIVN Web to Cloudflare

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

concurrency:
  group: apivn-cloudflare-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ycrqwekkafexqnlxpczd.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_5FgV9hFON8ZZFLc0WEcH7A_q-pUWbus
      NEXT_PUBLIC_GATEWAY_BASE_URL: https://api.apivn.tech
      NEXT_PUBLIC_DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_BILLING_MODE: ${{ vars.PRODUCTION_BILLING_MODE || 'disabled' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck web
        run: npm run typecheck --workspace @aiapi/web

      - name: Test web
        run: npm test --workspace @aiapi/web

      - name: Build OpenNext for Cloudflare
        run: npm run cf:build --workspace @aiapi/web

      - name: Sync and validate Worker secrets
        working-directory: apps/web
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ADMIN_SECRET: ${{ secrets.SUPABASE_ADMIN_SECRET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GATEWAY_INTERNAL_TOKEN: ${{ secrets.GATEWAY_INTERNAL_TOKEN }}
          GATEWAY_USER_ASSERTION_SECRET: ${{ secrets.GATEWAY_USER_ASSERTION_SECRET }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          set -euo pipefail

          put_if_present() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "Synced $name to apivn-web"
            fi
          }

          put_if_present SUPABASE_ADMIN_SECRET "${SUPABASE_ADMIN_SECRET:-}"
          put_if_present SUPABASE_SECRET_KEY "${SUPABASE_SECRET_KEY:-}"
          put_if_present SUPABASE_SERVICE_ROLE_KEY "${SUPABASE_SERVICE_ROLE_KEY:-}"
          put_if_present GATEWAY_INTERNAL_TOKEN "${GATEWAY_INTERNAL_TOKEN:-}"
          put_if_present GATEWAY_USER_ASSERTION_SECRET "${GATEWAY_USER_ASSERTION_SECRET:-}"
          put_if_present PAYOS_CLIENT_ID "${PAYOS_CLIENT_ID:-}"
          put_if_present PAYOS_API_KEY "${PAYOS_API_KEY:-}"
          put_if_present PAYOS_CHECKSUM_KEY "${PAYOS_CHECKSUM_KEY:-}"
          put_if_present PAYMENT_WEBHOOK_SECRET "${PAYMENT_WEBHOOK_SECRET:-}"
          put_if_present ADMIN_EMAILS "${ADMIN_EMAILS:-}"

          secret_list="$(npx wrangler secret list --format=json)"
          has_secret() {
            printf '%s' "$secret_list" | jq -e --arg name "$1" 'map(.name) | index($name) != null' >/dev/null
          }

          if ! has_secret SUPABASE_ADMIN_SECRET && ! has_secret SUPABASE_SECRET_KEY && ! has_secret SUPABASE_SERVICE_ROLE_KEY; then
            echo '::error::apivn-web thiếu Supabase admin secret. Signup và topup sẽ lỗi nếu deploy.'
            exit 1
          fi

          for required in GATEWAY_INTERNAL_TOKEN GATEWAY_USER_ASSERTION_SECRET; do
            if ! has_secret "$required"; then
              echo "::error::apivn-web thiếu $required. Playground production sẽ lỗi."
              exit 1
            fi
          done

          payos_count=0
          for payos_secret in PAYOS_CLIENT_ID PAYOS_API_KEY PAYOS_CHECKSUM_KEY; do
            if has_secret "$payos_secret"; then
              payos_count=$((payos_count + 1))
            fi
          done
          if [ "$payos_count" -ne 0 ] && [ "$payos_count" -ne 3 ]; then
            echo '::error::Cấu hình payOS không đầy đủ. Cần đủ PAYOS_CLIENT_ID, PAYOS_API_KEY và PAYOS_CHECKSUM_KEY hoặc bỏ cả ba.'
            exit 1
          fi

          if [ "$DEPLOY_BILLING_MODE" != 'disabled' ] && [ "$DEPLOY_BILLING_MODE" != 'live' ]; then
            echo '::error::PRODUCTION_BILLING_MODE chỉ chấp nhận disabled hoặc live.'
            exit 1
          fi
          if [ "$DEPLOY_BILLING_MODE" = 'live' ] && [ "$payos_count" -ne 3 ]; then
            echo '::error::Không thể bật billing live khi chưa đủ ba PayOS secrets.'
            exit 1
          fi

          # Defaults to disabled. Enabling live billing requires both an explicit
          # repository variable and a complete verified PayOS configuration.
          printf '%s' "$DEPLOY_BILLING_MODE" | npx wrangler secret put BILLING_MODE >/dev/null
          echo "Set BILLING_MODE=$DEPLOY_BILLING_MODE on apivn-web"

          echo 'Required Worker secrets are present and payOS configuration is consistent.'

      - name: Deploy Worker
        working-directory: apps/web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
