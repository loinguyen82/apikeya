name: Package source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git -czf apikeya-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: apikeya-source
          path: apikeya-source.tgz
          retention-days: 1
# temporary netlify packaging trigger
